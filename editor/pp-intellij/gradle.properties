# The IDE the plugin compiles and is tested against (a local JetBrains IDE of the 2026.2 line or newer).
# IntelliJ IDEA is used rather than CLion because CLion's backend services do not
# shut down cleanly inside the test framework; the plugin uses only platform APIs.
platformPath=C:/Program Files/JetBrains/IntelliJ IDEA 2026.2.3

# The CLion that `gradlew runClion` starts with the plugin installed (a separate sandbox).
clionPath=D:/JetBrains/CLion 2026.2.3

org.gradle.jvmargs=-Xmx2g
kotlin.stdlib.default.dependency=false
